<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakeshore Tech Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a console shell. Left rail of sections, top context bar (org unit + licenses), work area on the right. Collapses to a top tab strip on phones. */
:root {
  --bg: #f3f6f6; --panel: #ffffff; --ink: #172327; --muted: #5b6b70; --line: #d6e1df;
  --accent: #0e7c7b; --accent-ink: #ffffff; --accent-soft: #e2f1f0; --amber: #e8a33d; --amber-soft: #fbefdb;
  --good: #2e7d4f; --good-soft: #e3f3e8; --warn: #9a6200; --warn-soft: #fff3d6; --bad: #b5482f; --bad-soft: #f9e3dd;
  --rail: #12343b; --rail-ink: #e8f1f0; --rail-muted: #9fb7b5;
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a1d; --panel: #16252a; --ink: #e4eeec; --muted: #9db0b2; --line: #28403f;
  --accent: #3fb3ae; --accent-ink: #062022; --accent-soft: #163c3c; --amber: #f0b35a; --amber-soft: #3a2d17;
  --good: #6fcf97; --good-soft: #17352a; --warn: #f2c46b; --warn-soft: #3a3016; --bad: #f08a72; --bad-soft: #3d1f19;
  --rail: #0a1416; --rail-ink: #e4eeec; --rail-muted: #8aa3a2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1a1d; --panel: #16252a; --ink: #e4eeec; --muted: #9db0b2; --line: #28403f;
  --accent: #3fb3ae; --accent-ink: #062022; --accent-soft: #163c3c; --amber: #f0b35a; --amber-soft: #3a2d17;
  --good: #6fcf97; --good-soft: #17352a; --warn: #f2c46b; --warn-soft: #3a3016; --bad: #f08a72; --bad-soft: #3d1f19;
  --rail: #0a1416; --rail-ink: #e4eeec; --rail-muted: #8aa3a2; color-scheme: dark }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-size: 0.9em; }
.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: grid; gap: 2px; }
.brand b { font-size: 17px; letter-spacing: 0.01em; }
.brand span { color: var(--rail-muted); font-size: 12px; }
.nav { display: grid; gap: 2px; }
.nav button { all: unset; cursor: pointer; padding: 8px 10px; border-radius: 6px; color: var(--rail-ink); display: flex; justify-content: space-between; gap: 8px; }
.nav button:hover { background: rgba(255,255,255,0.07); }
.nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.nav button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.nav .count { font-family: var(--font-mono); font-size: 12px; opacity: 0.85; }
.rail-foot { margin-top: auto; color: var(--rail-muted); font-size: 12px; display: grid; gap: 8px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 12px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.topbar .ctx { color: var(--muted); font-size: 13px; }
.topbar .ctx b { color: var(--ink); }
.lic { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.meter { width: 120px; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.work { padding-block: 20px 40px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
h1 { font-size: 24px; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; }
p { margin: 0; }
.sub { color: var(--muted); max-width: 70ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); gap: 18px; align-items: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 4px; }
.tile .n { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 13px; }
.btn { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
input[type=text], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tree { display: grid; gap: 2px; }
.tree button { all: unset; cursor: pointer; padding: 5px 8px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
.tree button:hover { background: var(--accent-soft); }
.tree button[aria-selected="true"] { background: var(--accent-soft); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.tree button:focus-visible { outline: 2px solid var(--amber); }
.tree .twig { color: var(--muted); font-family: var(--font-mono); font-size: 12px; white-space: pre; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--accent-soft); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: none; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.mute { background: var(--line); color: var(--muted); }
.policy { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 300px); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.policy:last-child { border-bottom: none; }
.policy .help { color: var(--muted); font-size: 13px; }
.src { font-size: 12px; color: var(--muted); }
.src.local { color: var(--accent); font-weight: 700; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { border-color: var(--accent); font-weight: 700; }
.tabs button:focus-visible { outline: 2px solid var(--amber); }
.mission { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mission:last-child { border-bottom: none; }
.check { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.check.done { background: var(--good); color: var(--panel); }
.check.todo { border: 2px solid var(--line); color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; }
.ticket { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; }
.ticket b { color: var(--ink); }
.log { display: grid; gap: 0; }
.log div { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.log time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.notice { border-radius: var(--r); padding: 10px 12px; font-size: 14px; }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.good { background: var(--good-soft); color: var(--good); }
.notice.info { background: var(--accent-soft); color: var(--ink); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--rail); color: var(--rail-ink); padding: 10px 14px; border-radius: var(--r); box-shadow: 0 6px 24px rgba(0,0,0,0.25); max-width: min(360px, calc(100vw - 32px)); }
/* Chromebook preview */
.laptop { width: 100%; max-width: 640px; }
.screen { aspect-ratio: 16 / 10; max-width: 100%; border: 10px solid #1e2427; border-radius: 12px 12px 4px 4px; position: relative; overflow: hidden; background: #24343a; color: #fff; }
.base { height: 14px; background: #2c3438; border-radius: 0 0 14px 14px; margin: 0 -4%; }
.wall-school { background: radial-gradient(circle at 30% 30%, #1b8f8c, #0b3d42 70%); }
.wall-free { background: repeating-linear-gradient(45deg, #b04ad1 0 24px, #ff8a00 24px 48px, #2ec4ff 48px 72px); }
.desk { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: 12px; gap: 8px; }
.wall-label { font-size: 13px; background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 6px; justify-self: start; }
.browser { background: #fff; color: #172327; border-radius: 8px; align-self: center; justify-self: center; width: min(88%, 460px); padding: 10px; display: grid; gap: 8px; font-size: 13px; }
.browser .bar { display: flex; gap: 6px; }
.browser input { flex: 1; background: #eef3f3; border: 1px solid #c9d6d4; color: #172327; }
.shelf { justify-self: center; display: flex; gap: 6px; background: rgba(0,0,0,0.45); padding: 6px 10px; border-radius: 99px; flex-wrap: wrap; justify-content: center; }
.shelf span { background: rgba(255,255,255,0.9); color: #172327; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
.lock { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 20px; background: #0d1416; }
.lock .msg { max-width: 40ch; font-size: 15px; }
.kiosk { position: absolute; inset: 0; background: #f4f7fb; color: #172327; display: grid; place-content: center; text-align: center; gap: 8px; padding: 16px; }
.signin { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: #20323a; }
.signin .card { background: #fff; color: #172327; border-radius: 10px; padding: 16px 20px; display: grid; gap: 8px; min-width: 220px; }
.overlay { position: fixed; inset: 0; background: rgba(8,16,18,0.55); display: grid; place-items: center; padding: 16px; z-index: 20; }
.dialog { background: var(--panel); border-radius: 12px; border: 1px solid var(--line); width: min(540px, 100%); max-height: 90vh; overflow: auto; padding: 18px; display: grid; gap: 12px; }
.disclaimer { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
  .rail { padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; }
  .nav { grid-auto-flow: column; overflow-x: auto; }
  .nav button { white-space: nowrap; }
  .rail-foot { display: none; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .policy { grid-template-columns: minmax(0, 1fr); }
  .lic { margin-left: 0; }
  .topbar, .work { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: no-preference) { .nav button, .btn, .tree button { transition: background 0.15s, border-color 0.15s; } }
</style>
<style>
/* Tech tour additions */
body { margin: 0; }
.stepper { display: grid; gap: 12px; align-content: start; }
.mapwrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; }
.mapwrap svg { width: 100%; height: auto; display: block; }
.mapwrap [data-stop] { cursor: pointer; }
.mapwrap [data-stop]:hover rect.bld { stroke: var(--amber); stroke-width: 6; }
.mapwrap [data-stop]:focus-visible { outline: 3px solid var(--amber); }
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.dev { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: start; background: var(--panel); font-size: 14px; cursor: pointer; }
.dev:hover { border-color: var(--accent); }
.dev input { margin-top: 3px; grid-row: span 2; }
.dev small { color: var(--muted); font-variant-numeric: tabular-nums; }
.values { display: flex; flex-wrap: wrap; gap: 6px; }
.values label { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; font-size: 14px; cursor: pointer; }
.owner { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; }
.owner q { font-size: 16px; font-style: italic; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.stamp { border: 2px dashed var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 4px; text-align: center; }
.stamp.got { border-color: var(--accent); background: var(--accent-soft); }
.stamp .seal { font-size: 26px; font-weight: 700; color: var(--accent); }
.budget { font-variant-numeric: tabular-nums; font-weight: 700; }
.budget.over { color: var(--bad); }
</style>

</head>

<div class="shell">
  <aside class="rail">
    <a href="index.html" class="hub-back" style="color:var(--rail-ink);font-size:13px;text-decoration:underline;text-underline-offset:3px">&larr; All simulators</a><div class="brand"><b>Lakeshore Tech Tour</b><span>Harbor County · training</span></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>

      <button class="btn small" id="resetBtn" style="color:var(--rail-ink);background:transparent;border-color:var(--rail-muted)">Reset simulator</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="ctx">Tour of <b>Harbor County businesses</b></div>
      <div class="ctx">Tour guide <b id="whoName"></b></div>
      <div class="lic" id="lic"></div>
    </header>
    <main class="work" id="work"></main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => "$" + n.toLocaleString();
  const wc = (s) => String(s || "").split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w)).length;

  // The eight categories from topic 1.1, plus a bucket for devices outside them
  const CATS = ["Phones and tablets", "Rugged handhelds", "Scanners and printers", "POS and payment", "Wearables", "Drones and robots", "Connected sensors", "Vehicle systems"];
  const OTHER = "Not one of the eight (it connects or displays)";
  const VALUES = ["Speed", "Accuracy", "Visibility", "Customer service", "Safety and compliance", "Cost"];
  const DEVICES = [
    { id: "phone", name: "Smartphone", price: 400, cat: "Phones and tablets" },
    { id: "tablet", name: "Tablet", price: 350, cat: "Phones and tablets" },
    { id: "chromebook", name: "Chromebook", price: 300, cat: "Phones and tablets", note: "a laptop-style device; we'll file it with phones and tablets" },
    { id: "rugged", name: "Rugged handheld computer", price: 1200, cat: "Rugged handhelds" },
    { id: "scanner", name: "Barcode scanner", price: 150, cat: "Scanners and printers" },
    { id: "label", name: "Label printer", price: 250, cat: "Scanners and printers" },
    { id: "rfid", name: "RFID reader and tags", price: 1500, cat: "Scanners and printers" },
    { id: "card", name: "Card reader", price: 60, cat: "POS and payment" },
    { id: "watch", name: "Smartwatch", price: 300, cat: "Wearables" },
    { id: "badge", name: "Wearable panic badge", price: 150, cat: "Wearables" },
    { id: "drone", name: "Mapping drone", price: 3000, cat: "Drones and robots" },
    { id: "robot", name: "Robot vacuum", price: 400, cat: "Drones and robots" },
    { id: "temp", name: "Temperature sensor", price: 80, cat: "Connected sensors" },
    { id: "collar", name: "Cow collar sensor", price: 90, cat: "Connected sensors" },
    { id: "gps", name: "Truck GPS tracker", price: 150, cat: "Vehicle systems" },
    { id: "hotspot", name: "Mobile hotspot", price: 200, cat: OTHER },
    { id: "sign", name: "Digital sign", price: 900, cat: OTHER },
  ];
  const dev = (id) => DEVICES.find((d) => d.id === id);
  // fits: picking any one of these solves the core problem; values: strong matches
  const STOPS = [
    { id: "miller", short: "Miller's Hardware", name: "Miller's Hardware", who: "The Miller family, owners", lp: "LP2", lpt: "The Store That's Always Out of Stock", x: 120, y: 330, budget: 500,
      say: "Our count sheet says 40 boxes of deck screws, but the shelf is empty and a contractor just walked out. We count everything by hand once a month.", fits: ["scanner", "label", "rugged"], values: ["Accuracy", "Visibility", "Customer service"],
      hint: "The problem is counting. What device reads an item's code so nobody has to write it down?", why: "Scanning replaces hand counts and typos, so the numbers match the shelf." },
    { id: "harlan", short: "Harlan Dairy", name: "Harlan Family Dairy", who: "Dana Harlan, dairy farmer", lp: "LP3", lpt: "No Signal in the Barn", x: 330, y: 470, budget: 800,
      say: "We milk 400 cows in two metal barns and our phones drop calls inside. We want to know which cows are sick before they look sick.", fits: ["collar", "hotspot"], values: ["Visibility", "Safety and compliance", "Cost"],
      hint: "One part of the problem is connection. The other is knowing about each cow without walking the barn.", why: "Collar sensors watch every cow around the clock, and connectivity gets that data out of a metal barn." },
    { id: "lakeview", short: "Lakeview School", name: "Lakeview Middle School", who: "Ms. Ortiz, principal", lp: "LP4", lpt: "800 Chromebooks by Monday", x: 560, y: 520, budget: 350,
      say: "Every student needs a device for class that's cheap, sturdy and easy for one IT person to manage. Pick what we should buy for each student.", fits: ["chromebook", "tablet"], values: ["Cost", "Speed", "Visibility"],
      hint: "The budget is per student, and it has to have a keyboard-friendly way to do schoolwork.", why: "A low-cost device that IT can manage from one console fits a whole school." },
    { id: "riverbend", short: "Riverbend Clinic", name: "Riverbend Family Clinic", who: "Jordan Price, clinic manager", lp: "LP5", lpt: "The Nurse Lost Her Phone", x: 820, y: 470, budget: 900,
      say: "Our home health nurses drive to patients' houses with paper charts. They need patient information on the road, and it has to stay private.", fits: ["phone", "tablet"], values: ["Safety and compliance", "Customer service", "Speed"],
      hint: "The nurse needs something small to carry into a patient's home that can open a chart.", why: "A managed phone or tablet carries the chart to the patient, and it can be locked or wiped if it's lost." },
    { id: "curds", short: "Curds & Brats", name: "Big Lake Curds & Brats", who: "Gina Kowalski, food truck owner", lp: "LP6", lpt: "Cash Only, Long Lines", x: 980, y: 300, budget: 500,
      say: "I'm cash only. The line gets so long people walk away, and I never know what's selling. Half my customers don't carry cash anymore.", fits: ["card"], values: ["Speed", "Customer service", "Visibility"],
      hint: "Customers want to pay with a card or phone. What takes those payments?", why: "A card reader with a phone or tablet takes every kind of payment and tracks every sale." },
    { id: "twin", short: "Twin Creeks Co-op", name: "Twin Creeks Ag Cooperative", who: "Ellen Brandt, agronomy manager", lp: "LP7", lpt: "Eyes in the Sky and on the Job", x: 830, y: 150, budget: 4000,
      say: "We scout 3,000 acres of members' fields on foot and on ATVs. It takes days, and we still miss problems in the middle of fields.", fits: ["drone"], values: ["Speed", "Visibility", "Cost"],
      hint: "Think about seeing a whole field at once, from above.", why: "A mapping drone photographs a whole field in minutes and shows trouble spots from above." },
    { id: "northshore", short: "Northshore", name: "Northshore Distribution", who: "Greg Lindqvist, warehouse manager", lp: "LP8", lpt: "Where Did That Pallet Go?", x: 560, y: 260, budget: 3000,
      say: "Pallets get lost or shipped to the wrong customer, and a full inventory count shuts us down for a whole weekend.", fits: ["rfid", "rugged", "scanner"], values: ["Accuracy", "Speed", "Visibility"],
      hint: "Counting thousands of pallets is the slow part. What reads them faster than a person with a clipboard?", why: "RFID and rugged scanners count and track pallets in hours instead of a weekend." },
    { id: "harbor", short: "Harbor View", name: "Harbor View Hospital", who: "Monica Reyes, facilities director", lp: "LP9", lpt: "Smart Signs and Smart Wearables", x: 330, y: 170, budget: 1200,
      say: "Our café's walk-in cooler died overnight and nobody knew until morning. And visitors keep getting lost looking for departments.", fits: ["temp", "sign"], values: ["Safety and compliance", "Customer service", "Cost"],
      hint: "Something has to watch the cooler at 2 AM, or help a lost visitor without a person.", why: "A connected sensor texts someone when the cooler warms up, and a digital sign can guide visitors." },
  ];
  const stop = (id) => STOPS.find((s) => s.id === id);

  function seed() {
    const visits = {}; STOPS.forEach((s) => { visits[s.id] = { picks: [], vals: [], ok: false, tries: 0 }; });
    return { v: 1, student: "", visits, sorted: {}, spots: [], dream: "", cur: "miller", view: "home",
      log: [{ t: stamp(), m: "Tour started. Eight Harbor County businesses are waiting for advice." }] };
  }
  function stamp() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  const KEY = "md-tour-sim-v1";
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 1) S = seed();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage blocked: keep working in memory */ } }
  function log(m) { S.log.unshift({ t: stamp(), m }); if (S.log.length > 300) S.log.length = 300; }
  let toastTimer;
  function toast(m) { const l = $("#layer"); const o = l.querySelector(".toast"); if (o) o.remove(); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = m; l.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3400); }

  // ---------- Judging a pick ----------
  const spent = (v) => v.picks.reduce((a, id) => a + dev(id).price, 0);
  function judge(s, v) {
    if (!v.picks.length) return { ok: false, msg: "Pick at least one device from the catalog." };
    if (spent(v) > s.budget) return { ok: false, msg: `That's ${money(spent(v))}, over the ${money(s.budget)} budget. Small businesses have to make choices too.` };
    if (!v.picks.some((id) => s.fits.includes(id))) return { ok: false, msg: `Not quite. ${s.hint}` };
    if (!v.vals.length) return { ok: false, msg: "Good device choice! Now tag at least one kind of value it delivers." };
    if (!v.vals.some((x) => s.values.includes(x))) return { ok: false, msg: `The device works, but think again about the value. Which of the six would ${s.who.split(",")[0]} notice first?` };
    const extra = v.picks.filter((id) => !s.fits.includes(id) && !(s.id === "curds" && ["phone", "tablet"].includes(id)));
    return { ok: true, msg: `Good fit! ${s.why}` + (extra.length ? ` (The ${extra.map((id) => dev(id).name.toLowerCase()).join(" and ")} won't help much with this problem, but you stayed on budget.)` : "") };
  }

  // ---------- Missions ----------
  function missions() {
    const ms = STOPS.map((s) => ({ t: `Help ${s.name}`, d: `${s.who.split(",")[0]}'s problem: pick devices within ${money(s.budget)} and tag the value.`, ok: S.visits[s.id].ok }));
    const used = new Set(STOPS.flatMap((s) => (S.visits[s.id].ok ? S.visits[s.id].vals : [])));
    const sortable = DEVICES;
    return ms.concat([
      { t: "Sort every device in the catalog into its category", d: "Use the eight categories from topic 1.1. Two devices don't fit any of the eight.", ok: sortable.every((d) => S.sorted[d.id] === d.cat) },
      { t: "Use all six kinds of value at least once", d: "Across your good-fit stops, tag speed, accuracy, visibility, customer service, safety and compliance, and cost.", ok: VALUES.every((x) => used.has(x)) },
      { t: "Log three devices in Spot the Tech", d: "Real mobile devices you've seen at work in local businesses.", ok: S.spots.filter((x) => x.biz && x.device && x.cat && wc(x.job) >= 3).length >= 3 },
      { t: "Pick the business you'd most like to help, and say why", d: "On your Passport page, in at least 15 words. It's a head start on your final project idea.", ok: wc(S.dream) >= 15 },
    ]);
  }

  // ---------- Views ----------
  const NAV = [["home", "Overview"], ["map", "Town map"], ["stop", "Visit a business"], ["catalog", "Device catalog"], ["spot", "Spot the Tech"], ["passport", "Your passport"], ["missions", "Checklist"], ["log", "Activity log"], ["report", "Submit report"]];
  function renderNav() {
    const ms = missions(), done = ms.filter((m) => m.ok).length, stamps = STOPS.filter((s) => S.visits[s.id].ok).length;
    const counts = { missions: `${done}/${ms.length}`, passport: `${stamps}/8`, spot: S.spots.length };
    $("#nav").innerHTML = NAV.map(([v, l]) => `<button data-view="${v}" ${S.view === v ? 'aria-current="page"' : ""}><span>${l}</span>${counts[v] != null ? `<span class="count">${counts[v]}</span>` : ""}</button>`).join("");
    $("#whoName").textContent = S.student || "Student";
    $("#lic").innerHTML = `Checklist ${done} of ${ms.length}<span class="meter"><i style="width:${Math.round((done / ms.length) * 100)}%"></i></span>`;
  }
  function mapSVG() {
    return `<svg viewBox="0 0 1100 600" role="img" aria-label="Map of Harbor County with eight businesses">
      <rect width="1100" height="600" fill="#e8f0e3"/>
      <path d="M0 0 H1100 V70 C900 110 700 40 500 85 C300 125 150 60 0 95 Z" fill="#9cc7e0"/><text x="40" y="45" font-size="24" fill="#1f4f73" font-style="italic">Lake Michigan</text>
      <path d="M0 400 H1100" stroke="#cfc7b6" stroke-width="26"/><path d="M450 90 V600" stroke="#cfc7b6" stroke-width="26"/><path d="M700 90 L1100 520" stroke="#cfc7b6" stroke-width="20"/>
      <text x="20" y="430" font-size="16" fill="#6b6455">County Road K</text>
      ${[[60, 520], [150, 560], [960, 560], [1040, 520], [700, 560], [250, 260]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="16" fill="#9bbf86"/>`).join("")}
      ${STOPS.map((s) => { const got = S.visits[s.id].ok; return `<g data-stop="${s.id}" tabindex="0" role="button" aria-label="Visit ${esc(s.name)}">
        <rect class="bld" x="${s.x - 80}" y="${s.y - 50}" width="160" height="80" rx="10" fill="${got ? "#0e7c7b" : "#ffffff"}" stroke="#12343b" stroke-width="3"/>
        <text x="${s.x}" y="${s.y - 15}" font-size="15" text-anchor="middle" font-weight="700" fill="${got ? "#ffffff" : "#12343b"}">${esc(s.short)}</text>
        <text x="${s.x}" y="${s.y + 8}" font-size="13" text-anchor="middle" fill="${got ? "#e2f1f0" : "#5b6b70"}">${s.lp}${got ? " · stamped ✓" : ""}</text></g>`; }).join("")}
    </svg>`;
  }
  function vHome() {
    return `<div><h1>Overview</h1><p class="sub">Welcome to Harbor County. Eight local businesses have a problem that a mobile device could fix. Visit each one, pick the right device on a small budget, and say what kind of value it delivers. You'll come back to every one of these businesses later in the course.</p></div>
      <div class="ticket"><b>Message from the Harbor County Business Association</b><span>"Our members keep asking why everyone carries a tablet now. Before you write us a guide, take a tour. Meet our members, hear their problems and suggest a device for each one. Keep it within their budgets. These are small businesses!"</span></div>
      <div class="mapwrap">${mapSVG()}</div>
      <div class="panel"><h2>How the tour works</h2><p class="hint"><b>Town map:</b> click a business. <b>Visit a business:</b> hear the problem, pick devices, tag the value, check your pick. <b>Device catalog:</b> sort each device into the categories from topic 1.1. <b>Spot the Tech:</b> log real devices you've seen. <b>Your passport</b> collects a stamp for each business you help.</p></div>`;
  }
  function vMap() { return `<div><h1>Town map</h1><p class="sub">Click a business to visit it. Businesses you've helped turn teal.</p></div><div class="mapwrap">${mapSVG()}</div>`; }
  function vStop() {
    const s = stop(S.cur), v = S.visits[s.id], j = v.tries ? judge(s, v) : null, sp = spent(v);
    return `<div><h1>${esc(s.name)}</h1><p class="sub">${esc(s.who)} · Budget <span class="budget ${sp > s.budget ? "over" : ""}">${money(sp)} of ${money(s.budget)}</span></p></div>
      <div class="row">${STOPS.map((x) => `<button class="btn small ${x.id === s.id ? "primary" : ""}" data-go="${x.id}">${S.visits[x.id].ok ? "✓ " : ""}${esc(x.short)}</button>`).join("")}</div>
      <div class="owner"><b>${esc(s.who)}</b><q>${esc(s.say)}</q></div>
      <div class="panel"><h2>1. Pick the device or devices</h2><div class="catalog">${DEVICES.map((d) => `<label class="dev"><input type="checkbox" class="pick" value="${d.id}" ${v.picks.includes(d.id) ? "checked" : ""}><span>${d.name}</span><small>${money(d.price)}</small></label>`).join("")}</div></div>
      <div class="panel"><h2>2. What kind of value does it deliver?</h2><div class="values">${VALUES.map((x) => `<label><input type="checkbox" class="val" value="${x}" ${v.vals.includes(x) ? "checked" : ""}>${x}</label>`).join("")}</div>
        <div class="row"><button class="btn primary" id="checkPick">Check my pick</button>${v.ok ? '<span class="pill good">Stamped</span>' : ""}</div>
        ${j ? `<div class="notice ${j.ok ? "good" : "bad"}">${esc(j.msg)}</div>` : ""}
        ${v.ok ? `<p class="hint">You'll visit ${esc(s.name)} again in ${s.lp}: ${esc(s.lpt)}.</p>` : ""}</div>`;
  }
  function vCatalog() {
    return `<div><h1>Device catalog</h1><p class="sub">Sort each device into one of the eight categories of business mobile devices from topic 1.1. Prices are rough examples.</p></div>
      <div class="tablewrap"><table><thead><tr><th>Device</th><th>Example price</th><th>Category</th><th></th></tr></thead><tbody>
      ${DEVICES.map((d) => { const v = S.sorted[d.id]; return `<tr><td><b>${d.name}</b>${d.note ? `<br><span class="hint">${d.note}</span>` : ""}</td><td>${money(d.price)}</td><td><select data-sort="${d.id}" aria-label="Category for ${d.name}"><option value="">Choose…</option>${CATS.concat([OTHER]).map((c) => `<option ${c === v ? "selected" : ""}>${c}</option>`).join("")}</select></td><td>${v ? (v === d.cat ? '<span class="pill good">Right</span>' : '<span class="pill bad">Try again</span>') : ""}</td></tr>`; }).join("")}
      </tbody></table></div>`;
  }
  function vSpot() {
    return `<div><h1>Spot the Tech</h1><p class="sub">Log mobile devices you've actually seen at work around town: a checkout, a pharmacy counter, a delivery truck, a farm. This is the start of the Spot the Tech journal you'll keep all semester. Describe the device, not the people.</p></div>
      <div class="panel stepper"><div class="row"><label for="spBiz">Business type</label><input type="text" id="spBiz" placeholder="e.g. grocery store checkout"><label for="spDev">Device</label><input type="text" id="spDev" placeholder="e.g. handheld scanner"></div>
        <div class="row"><label for="spCat">Category</label><select id="spCat"><option value="">Choose…</option>${CATS.concat([OTHER]).map((c) => `<option>${c}</option>`).join("")}</select></div>
        <label for="spJob">What it does for the business</label><input type="text" id="spJob" placeholder="e.g. scans items so the price and stock update instantly">
        <div><button class="btn primary" id="spAdd">Add to my log</button></div></div>
      ${S.spots.length ? `<div class="tablewrap"><table><thead><tr><th>Business</th><th>Device</th><th>Category</th><th>What it does</th><th></th></tr></thead><tbody>${S.spots.map((x, i) => `<tr><td>${esc(x.biz)}</td><td>${esc(x.device)}</td><td>${esc(x.cat)}</td><td>${esc(x.job)}</td><td><button class="btn small" data-delspot="${i}">Remove</button></td></tr>`).join("")}</tbody></table></div>` : '<p class="hint">Nothing logged yet.</p>'}`;
  }
  function vPassport() {
    return `<div><h1>Your passport</h1><p class="sub">A stamp for every business you've helped, and where you'll meet them again.</p></div>
      <div class="stamps">${STOPS.map((s) => { const v = S.visits[s.id]; return `<div class="stamp ${v.ok ? "got" : ""}"><span class="seal">${v.ok ? "✓" : "?"}</span><b>${esc(s.name)}</b><span class="hint">${s.lp}: ${esc(s.lpt)}</span>${v.ok ? `<span class="hint">Your pick: ${v.picks.map((id) => dev(id).name).join(", ")} · ${v.vals.join(", ")}</span>` : `<button class="btn small" data-go="${s.id}">Visit</button>`}</div>`; }).join("")}</div>
      <div class="panel"><label for="dream"><b>Which business would you most like to help, and why?</b> (at least 15 words; ${wc(S.dream)} so far)</label><textarea id="dream" rows="3">${esc(S.dream)}</textarea><div><button class="btn primary" id="saveDream">Save</button></div><p class="hint">For the final project you'll pick a real local business. This is a warm-up.</p></div>`;
  }
  function vMissions() {
    const ms = missions();
    return `<div><h1>Checklist</h1><p class="sub">Each item checks itself as soon as you've done it.</p></div>
      <div class="panel">${ms.map((m, i) => `<div class="mission"><span class="check ${m.ok ? "done" : "todo"}">${m.ok ? "✓" : i + 1}</span><div><b>${m.t}</b><p class="hint">${m.d}</p></div></div>`).join("")}</div>`;
  }
  function logHTML(n) { return `<div class="log">${S.log.slice(0, n).map((l) => `<div><time>${l.t}</time><span>${esc(l.m)}</span></div>`).join("")}</div>`; }
  function vLog() { return `<div><h1>Activity log</h1><p class="sub">Everything you've done on the tour, newest first.</p></div><div class="panel">${logHTML(300)}</div>`; }
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).toUpperCase().padStart(7, "0"); }
  function reportText() {
    const ms = missions();
    const body = [
      "Lakeshore Tech Tour report (Harbor County)",
      `Tour guide: ${S.student || "(name not entered)"}`,
      `Generated: ${new Date().toLocaleString()}`,
      `Checklist: ${ms.filter((m) => m.ok).length} of ${ms.length} complete`,
      ...ms.map((m) => `  [${m.ok ? "x" : " "}] ${m.t}`),
      "", "Stops:", ...STOPS.map((s) => { const v = S.visits[s.id]; return `  ${s.name} (${s.lp}): ${v.picks.map((id) => dev(id).name).join(" + ") || "(no pick)"} | ${money(spent(v))} of ${money(s.budget)} | value: ${v.vals.join(", ") || "-"} | ${v.ok ? "good fit" : "not yet"} after ${v.tries} check${v.tries === 1 ? "" : "s"}`; }),
      "", `Catalog sorted correctly: ${DEVICES.filter((d) => S.sorted[d.id] === d.cat).length} of ${DEVICES.length}`,
      "Spot the Tech:", ...S.spots.map((x) => `  ${x.biz} | ${x.device} | ${x.cat} | ${x.job}`),
      `Business I'd most like to help: ${S.dream || "(not written)"}`,
      "", `Changes logged: ${S.log.length}`,
    ].join("\n");
    return body + `\nVerification code: ${hash((S.student || "") + "|" + body.replace(/Generated: .*\n/, ""))}`;
  }
  function vReport() {
    return `<div><h1>Submit report</h1><p class="sub">Enter your name, then copy this report into your Try It submission. The verification code changes whenever your tour or name changes.</p></div>
      <div class="panel"><div class="row"><label for="stuName">Your name</label><input type="text" id="stuName" value="${esc(S.student)}" placeholder="First and last name"><button class="btn primary" id="saveName">Save name</button></div></div>
      <div class="panel"><div class="row" style="justify-content:space-between"><h2>Tour report</h2><button class="btn" id="copyRep">Copy report</button></div>
      <div class="tablewrap" style="border:none"><pre class="mono" id="repText" style="margin:0;white-space:pre-wrap;font-size:13px">${esc(reportText())}</pre></div></div>`;
  }
  function render() {
    renderNav();
    const v = { home: vHome, map: vMap, stop: vStop, catalog: vCatalog, spot: vSpot, passport: vPassport, missions: vMissions, log: vLog, report: vReport }[S.view] || vHome;
    $("#work").innerHTML = v();
    save();
  }
  function goStop(id) { S.cur = id; S.view = "stop"; render(); window.scrollTo(0, 0); }

  // ---------- Events ----------
  document.addEventListener("click", (e) => {
    const g = e.target.closest("[data-stop]"); if (g) { goStop(g.dataset.stop); return; }
    const t = e.target.closest("button"); if (!t || t.disabled) return;
    if (t.dataset.view) { S.view = t.dataset.view; render(); return; }
    if (t.dataset.go) { goStop(t.dataset.go); return; }
    if (t.dataset.delspot) { S.spots.splice(+t.dataset.delspot, 1); log("Removed a Spot the Tech entry."); render(); return; }
    switch (t.id) {
      case "resetBtn": $("#layer").innerHTML = `<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>Reset the tour?</h2><p>This erases your picks, stamps and log.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="rsCancel">Keep my work</button><button class="btn danger" id="rsGo">Reset</button></div></div></div>`; break;
      case "rsCancel": $("#layer").innerHTML = ""; break;
      case "rsGo": S = seed(); $("#layer").innerHTML = ""; render(); toast("Tour reset."); break;
      case "checkPick": { const s = stop(S.cur), v = S.visits[s.id]; v.tries++; const j = judge(s, v); const was = v.ok; v.ok = j.ok;
        log(`${s.name}: picked ${v.picks.map((id) => dev(id).name).join(" + ") || "nothing"} (${money(spent(v))}), value ${v.vals.join(", ") || "none"}: ${j.ok ? "good fit" : "not yet"}.`);
        render(); if (j.ok && !was) toast(`Stamp earned: ${s.name}!`); break; }
      case "spAdd": { const x = { biz: $("#spBiz").value.trim(), device: $("#spDev").value.trim(), cat: $("#spCat").value, job: $("#spJob").value.trim() };
        if (!x.biz || !x.device || !x.cat || wc(x.job) < 3) { toast("Fill in all four parts. Use a few words for what it does."); return; }
        S.spots.push(x); log(`Spot the Tech: ${x.device} at ${x.biz}.`); render(); toast("Added."); break; }
      case "saveDream": S.dream = $("#dream").value.trim(); log(`Saved the business I'd most like to help (${wc(S.dream)} words).`); render(); toast("Saved."); break;
      case "saveName": S.student = $("#stuName").value.trim(); log(`Name set to "${S.student}".`); render(); toast("Name saved."); break;
      case "copyRep": { const txt = $("#repText").textContent; const fb = () => { const r = document.createRange(); r.selectNodeContents($("#repText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Report selected. Press Ctrl + C (or Cmd + C) to copy."); };
        try { navigator.clipboard.writeText(txt).then(() => toast("Report copied."), fb); } catch (err) { fb(); } break; }
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.classList.contains("pick")) { const v = S.visits[S.cur]; v.picks = [...document.querySelectorAll(".pick:checked")].map((x) => x.value); v.ok = false; render(); }
    else if (t.classList.contains("val")) { const v = S.visits[S.cur]; v.vals = [...document.querySelectorAll(".val:checked")].map((x) => x.value); v.ok = false; render(); }
    else if (t.dataset.sort) { S.sorted[t.dataset.sort] = t.value; const d = dev(t.dataset.sort); log(`Sorted ${d.name} into "${t.value}"${t.value === d.cat ? "" : " (not right yet)"}.`); render(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("#layer .overlay")) $("#layer").innerHTML = "";
    if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("[data-stop]")) { e.preventDefault(); goStop(e.target.closest("[data-stop]").dataset.stop); }
  });
  render();
})();
</script>

</body>
</html>
